name: Backport
on:
  pull_request_target:
    types:
      - closed
      - labeled


permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  backport:
    uses: sarahmccarthy123/.github/.github/workflows/reusable-sarah-backport.yml@82ca719a0423e20673c10a28637ebab1c68872c9
    with:
      label_pattern: "^backport (.+)$"
